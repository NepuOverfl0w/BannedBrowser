name: Bug report
description: Something in the browser (not a specific website) doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BannedBrowser version
      description: Output of `bannedbrowser --version`, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: A screenshot helps a lot. Run with `RUST_LOG=debug` for a detailed log.
