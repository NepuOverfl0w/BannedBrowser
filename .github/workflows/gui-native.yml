name: GUI tests (Windows, macOS)

# The GUI tests (tests/gui/*.sh) with real OS input on Windows and macOS. Started by hand
# while the drivers are new; they join the main CI once they are reliable.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gui:
    name: gui ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Screen size (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Continue
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: Screen size (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: system_profiler SPDisplaysDataType | grep -i resolution || true
      - name: GUI tests
        shell: bash
        run: scripts/gui-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-output-${{ matrix.os }}
          path: tests/gui/out/
          if-no-files-found: ignore
