name: CI

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev fontconfig fonts-dejavu-core \
            fonts-liberation2 fonts-noto-core fonts-noto-cjk libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 \
            xvfb fluxbox xdotool imagemagick wmctrl
      - name: Fetch spec suites
        shell: bash
        run: scripts/fetch-spec-tests.sh
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: check-deps
        shell: bash
        run: scripts/check-deps.sh --self-test && scripts/check-deps.sh
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets
      - name: unit + spec tests
        run: cargo test --workspace
      - name: reftests (headless)
        shell: bash
        run: scripts/run-reftests.sh
      - name: GUI smoke (Xvfb + Fluxbox)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          sleep 1
          DISPLAY=:99 fluxbox >/dev/null 2>&1 &
          sleep 1
          DISPLAY=:99 scripts/gui-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-${{ matrix.os }}
          path: |
            tests/reftests/out/
            tests/gui/out/
          if-no-files-found: ignore

  release:
    name: package ${{ matrix.os }}
    needs: test
    # Releases build packages; "[package]" in a commit message test-builds them.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[package]') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: package
        shell: bash
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bannedbrowser-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # Publishes a GitHub Release, either for a pushed v* tag, or for a commit whose
  # message contains "[release]": then the release is v<Cargo.toml version> and
  # GitHub creates that tag on the commit when the release is published.
  publish:
    name: GitHub Release
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bannedbrowser-*
          merge-multiple: true
      - name: Release tag, title and notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          fi
          ver="${tag#v}"
          case "$ver" in *-*) echo "refusing to release pre-release version $ver" >&2; exit 1;; esac
          echo "$tag" > tag.txt
          awk -v v="$ver" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md \
            | sed -E "s#\]\(([A-Z]+\.md)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/\1)#g" > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG section for $ver" >&2; exit 1; }
          cat >> notes.md <<'NOTE'

          ### Downloads
          Linux (`.tar.gz`), Windows (`.zip`) and macOS (`.app` in a `.zip`). The binaries are
          **not code-signed or notarized**, so Windows SmartScreen and macOS Gatekeeper will warn
          (on macOS: right-click → Open).
          NOTE
          grep -m1 "^## \[$ver\]" CHANGELOG.md \
            | sed -E 's/^## \[([^]]*)\] — "([^"]*)".*/BannedBrowser \1 — "\2"/' > title.txt
          echo "tag=$tag title=$(cat title.txt)"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(cat tag.txt)"
          ls -la dist
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "release $tag already exists; bump the version to release again" >&2
              exit 1
            fi
            # Tag made with GitHub's "Draft a new release" page: fill in that release.
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$(cat title.txt)" --notes-file notes.md
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$tag" dist/* --title "$(cat title.txt)" --notes-file notes.md --verify-tag
          else
            gh release create "$tag" dist/* --title "$(cat title.txt)" --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
