<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>New Tab</title><link rel="stylesheet" href="about:style.css">
<style>
body { padding-top: 96px; }
.logo { text-align: center; font-size: 44px; margin-bottom: 4px; }
.tag { text-align: center; margin-bottom: 32px; }
.search { display: block; margin: 0 auto; max-width: 560px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--muted); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.tiles { text-align: center; margin-top: 40px; }
.tile { display: inline-block; width: 96px; margin: 8px; text-align: center; color: var(--fg); text-decoration: none; font-size: 13px; }
.tile .icon { display: block; width: 64px; height: 64px; margin: 0 auto 6px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); line-height: 64px; font-size: 24px; font-weight: 700; color: var(--accent); }
</style></head>
<body><main>
<div class="logo brand"><span class="b">Banned</span>Browser<span class="x">_</span></div>
<p class="tag">No engines borrowed. No rules followed.</p>
<div class="search">Search with DuckDuckGo or enter address</div>
<div class="tiles">
<a class="tile" href="https://example.com/"><span class="icon">E</span>example.com</a>
<a class="tile" href="http://theoldnet.com/"><span class="icon">O</span>The Old Net</a>
<a class="tile" href="about:bannedbrowser"><span class="icon">B</span>About</a>
<a class="tile" href="about:about"><span class="icon">?</span>about:about</a>
</div>
</main></body></html>
